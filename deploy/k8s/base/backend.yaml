apiVersion: v1
kind: ServiceAccount
metadata:
  name: aoi-backend
automountServiceAccountToken: false
---
# The Service is named aoi-backend on purpose: the ServiceMonitor derives the Prometheus `job`
# label from it, and observability/rules.yml matches `up{job="aoi-backend"}`.
apiVersion: v1
kind: Service
metadata:
  name: aoi-backend
  labels:
    app.kubernetes.io/name: aoi-backend
spec:
  selector:
    app.kubernetes.io/name: aoi-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aoi-backend
  labels:
    app.kubernetes.io/name: aoi-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aoi-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aoi-backend
      annotations:
        # For annotation-based Prometheus discovery (no operator). Pods are scraped one by one;
        # see docs/observability.md for why the Service address must not be scraped.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: aoi-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aoi-backend
      containers:
        - name: backend
          image: aoi-backend
          # One uvicorn process per pod (the image's CMD). Do not add --workers: /metrics is
          # per process, see docs/observability.md.
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: aoi-config
            - secretRef:
                name: aoi-secrets
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1Gi
          # Liveness uses /health (process is up). Readiness uses /ready (PostgreSQL and Redis
          # reachable), so a database outage drains traffic instead of restart-looping the pods.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Uploads are streamed to a temp directory (up to 100 MiB) and ffmpeg writes here.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
