# TEMPLATE ONLY, not part of any kustomization. Do not commit real values.
#
# Create the real Secret out of band, e.g.
#   kubectl -n aoi create secret generic aoi-secrets --from-env-file=.env.k8s
# or with your secret manager (External Secrets, Sealed Secrets, SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: aoi-secrets
  namespace: aoi
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://aoi_runtime:CHANGE_ME@postgres.example.internal:5432/aoi
  MIGRATION_DATABASE_URL: postgresql+asyncpg://aoi_owner:CHANGE_ME@postgres.example.internal:5432/aoi
  REDIS_URL: redis://:CHANGE_ME@redis.example.internal:6379/0
  ANTHROPIC_API_KEY: CHANGE_ME
  OPENAI_API_KEY: CHANGE_ME
  CONNECTOR_ENCRYPTION_KEY: CHANGE_ME  # Fernet.generate_key()
  METRICS_TOKEN: CHANGE_ME             # required in oidc mode, otherwise /metrics returns 404
  INGEST_API_KEY: ""
