apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aoi-worker
  labels:
    app.kubernetes.io/part-of: autonomous-ops-intelligence
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aoi-worker
  namespaceSelector:
    matchNames: [aoi]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: aoi-secrets
          key: METRICS_TOKEN
