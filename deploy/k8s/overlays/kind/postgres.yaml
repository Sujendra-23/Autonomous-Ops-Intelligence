apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: aoi
data:
  init-db.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aoi
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aoi
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          args: ["-c", "max_connections=200"]
          env:
            - {name: POSTGRES_USER, value: aoi}
            - {name: POSTGRES_PASSWORD, value: aoi}
            - {name: POSTGRES_DB, value: aoi}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aoi", "-d", "aoi"]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
