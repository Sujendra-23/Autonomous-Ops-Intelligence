# Production-shaped overlay. PostgreSQL (pgvector, PG17+) and Redis are expected to be managed
# services reachable via the URLs in the aoi-secrets Secret. Replace every example.com value and
# the image registry/tag before use. Nothing here deploys itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: aoi-backend
    newName: registry.example.com/aoi-backend
    newTag: replace-with-a-version-tag
patches:
  - target: {kind: ConfigMap, name: aoi-config}
    patch: |-
      - op: replace
        path: /data/AUTH_ISSUER
        value: https://idp.example.com/
      - op: replace
        path: /data/AUTH_AUDIENCE
        value: https://api.example.com
      - op: replace
        path: /data/AUTH_JWKS_URL
        value: https://idp.example.com/.well-known/jwks.json
      - op: replace
        path: /data/CORS_ORIGINS
        value: https://app.example.com
