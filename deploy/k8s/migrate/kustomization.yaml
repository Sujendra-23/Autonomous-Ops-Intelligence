# Schema migration. Apply AFTER the namespace, ConfigMap and Secret exist and BEFORE (or alongside,
# in dev) the app, and delete a finished Job before re-applying: Job pod templates are immutable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aoi
resources:
  - job.yaml
images:
  - name: aoi-backend
    newName: aoi-backend
    newTag: dev
