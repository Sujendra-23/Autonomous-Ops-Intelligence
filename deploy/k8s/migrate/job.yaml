apiVersion: batch/v1
kind: Job
metadata:
  name: aoi-migrate
  labels:
    app.kubernetes.io/name: aoi-migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aoi-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: aoi-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: aoi-config
          env:
            # Schema changes use the schema-owner credential; the API and worker use a
            # NOSUPERUSER NOBYPASSRLS role (docs/production-release.md). In dev both can be the
            # same URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aoi-secrets
                  key: MIGRATION_DATABASE_URL
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
