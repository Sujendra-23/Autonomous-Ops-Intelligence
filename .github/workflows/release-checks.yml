name: Release checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aoi_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aoi_tests
      SAAS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ANALYTICS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/aoi_analytics_tests
      REQUIRE_DATABASE_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r backend/requirements-dev.txt
      - run: |
          python - <<'PY'
          import os, psycopg2
          connection = psycopg2.connect(os.environ["SAAS_TEST_ADMIN_URL"])
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE aoi_analytics_tests")
          connection.close()
          PY
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m evals.run_dlp
        working-directory: backend
      - run: python scripts/check_alerts.py
      - run: pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:account-motion
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend
      - run: node --test extension/tests/*.test.mjs
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aoi-backend ./backend
      - run: docker build -t aoi-frontend ./frontend

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run test:ui
        working-directory: desktop
      - run: npm audit --audit-level=moderate
        working-directory: desktop

  calls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aoi_calls
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aoi_calls
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      APP_PUBLIC_URL: http://127.0.0.1:5193
      VITE_AUTH_PROVIDER: ''
      VITE_AUTH_AUTHORITY: ''
      VITE_AUTH_CLIENT_ID: ''
      AOI_PROXY_TARGET: http://127.0.0.1:8002
      AOI_CALL_TEST_URL: http://127.0.0.1:5193
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker run -d --name aoi-test-media --network host livekit/livekit-server:v1.13.11 --dev --bind 0.0.0.0 --node-ip 127.0.0.1
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 > /tmp/aoi-calls-api.log 2>&1 &
        working-directory: backend
      - run: npm run dev -- --host 127.0.0.1 --port 5193 --strictPort > /tmp/aoi-calls-ui.log 2>&1 &
        working-directory: frontend
      - run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8002/api/meetings/status')
                  urllib.request.urlopen('http://127.0.0.1:5193')
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('Call test servers did not start')
          PY
      - run: npm run test:calls
        working-directory: frontend
      - run: npm run test:simple-ui
        working-directory: frontend
        env:
          AOI_TEST_URL: http://127.0.0.1:5193
