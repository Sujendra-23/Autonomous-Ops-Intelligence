name: Release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aoi_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aoi_tests
      SAAS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ANALYTICS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/aoi_analytics_tests
      REQUIRE_DATABASE_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: pip install -r backend/requirements-dev.txt
      - run: |
          python - <<'PY'
          import os, psycopg2
          connection = psycopg2.connect(os.environ["SAAS_TEST_ADMIN_URL"])
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE aoi_analytics_tests")
          connection.close()
          PY
      - run: python -m pytest -q
        working-directory: backend
      - run: pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend
      - run: node --test extension/tests/*.test.mjs
  notion-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/notion-webhook/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: services/notion-webhook
      - run: npm test
        working-directory: services/notion-webhook
      - run: docker build -t aoi-notion-webhook ./services/notion-webhook
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check and test rules
        run: |
          promtool() {
            docker run --rm -v "$PWD/observability:/obs:ro" -w /obs/tests \
              --entrypoint promtool prom/prometheus:v2.55.1 "$@"
          }
          promtool check rules /obs/rules.yml
          promtool test rules rules.test.yml
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aoi-backend ./backend
      - run: docker build -t aoi-frontend ./frontend
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate rendered manifests with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
          for dir in overlays/kind overlays/production migrate monitoring; do
            kubectl kustomize deploy/k8s/$dir | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - run: pip install pyyaml && python scripts/render_prometheusrule.py --check
      - run: docker build -t aoi-backend:kind ./backend
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: aoi
      - run: kind load docker-image aoi-backend:kind --name aoi
      - run: kubectl apply -k deploy/k8s/overlays/kind
      - run: deploy/k8s/smoke.sh kind-aoi
      - if: failure()
        run: |
          kubectl -n aoi get pods -o wide
          kubectl -n aoi describe pods | tail -80
          kubectl -n aoi logs deployment/aoi-backend --tail=80 || true
          kubectl -n aoi logs job/aoi-migrate --tail=40 || true
  java-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      - run: ./mvnw -B verify
        working-directory: clients/java
