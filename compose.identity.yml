# Optional local gateway, pinned to the reviewed upstream source revision.
# Run with docker-compose.yml and --env-file .env --env-file .env.identity.
services:
  identity-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identity_bootstrap
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?Set a bootstrap password}
      POSTGRES_DB: identity_gateway
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?Set a restricted application password}
    volumes:
      - identity_pg_data:/var/lib/postgresql/data
      - ./scripts/init-identity-db.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_bootstrap -d identity_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
  identity-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${IDENTITY_REDIS_PASSWORD:?Set a Redis password}"]
    environment:
      REDISCLI_AUTH: ${IDENTITY_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  identity-gateway:
    build:
      context: https://github.com/Sujendra-23/Multi-Tenant-Identity-Access-Gateway.git#17710570ef4fce276b07df1214a3b59795a035eb
      args:
        BINARY: gateway
    environment:
      ENV: development
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      POSTGRES_DSN: "postgres://identity_app:${IDENTITY_APP_PASSWORD}@identity-postgres:5432/identity_gateway?sslmode=disable"
      REDIS_ADDR: identity-redis:6379
      REDIS_PASSWORD: ${IDENTITY_REDIS_PASSWORD}
      JWT_ISSUER: https://gateway.local
      JWT_AUDIENCE: identity-gateway
      BOOTSTRAP_KEY: ${IDENTITY_BOOTSTRAP_KEY:?Set a tenant bootstrap key}
    ports: ["127.0.0.1:${IDENTITY_PORT:-8180}:8080"]
    depends_on:
      identity-postgres: { condition: service_healthy }
      identity-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  identity_pg_data:
