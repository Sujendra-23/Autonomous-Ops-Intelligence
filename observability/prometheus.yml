global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: aoi-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    # If METRICS_TOKEN is set on the backend, add:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
  - job_name: aoi-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]
    # In staging/production, mount the same token and add authorization here too.
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
