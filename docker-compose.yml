services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aoi}
      POSTGRES_DB: ${POSTGRES_DB:-aoi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aoi_pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aoi} -d ${POSTGRES_DB:-aoi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aoi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aoi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aoi}:${POSTGRES_PASSWORD:-aoi}@postgres:5432/${POSTGRES_DB:-aoi}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aoi-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aoi}:${POSTGRES_PASSWORD:-aoi}@postgres:5432/${POSTGRES_DB:-aoi}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: python -m app.workers.scheduler

  frontend:
    image: node:22-alpine
    container_name: aoi-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      # Browser calls go straight to the API in development. The console server (Ask panel) reaches it by service name.
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      BACKEND_URL: http://backend:8000
      # Server-side only: used by the Ask panel route, never sent to the browser.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"

  # Optional observability stack: `docker compose --profile observability up -d`
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: aoi-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
      - aoi_prometheus_data:/prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    container_name: aoi-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    # Refuse to start without a password so Grafana never runs with a blank or default login.
    entrypoint:
      - sh
      - -c
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "Set GRAFANA_ADMIN_PASSWORD in .env (make observability does this)"; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aoi-llm-observability.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aoi_grafana_data:/var/lib/grafana

volumes:
  aoi_pg_data:
  aoi_prometheus_data:
  aoi_grafana_data:
